name: flutide
description: A lightweight Flutter code editor with GitHub Actions build support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Pure-dart packages only (no native libs) to keep APK size small.
  highlight: ^0.7.0            # dart syntax tokenizer (color highlighting only, no lint/error checks)
  archive: ^3.6.1               # zip import / export
  path_provider: ^2.1.3         # app storage paths
  path: ^1.9.0
  shared_preferences: ^2.2.3    # settings + github token storage
  http: ^1.2.1                  # GitHub REST API calls
  file_picker: ^8.0.3           # pick a .zip to import / pick export destination
  share_plus: ^9.0.0            # share exported zip
  flutter_riverpod: ^2.5.1      # light state management

flutter:
  uses-material-design: true
