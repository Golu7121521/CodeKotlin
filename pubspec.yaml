name: movie_stream
description: "A next-gen movie streaming client with TMDB discovery and a native playback engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Video playback
  video_player: ^2.9.1
  chewie: ^1.8.5

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Images
  cached_network_image: ^3.3.1

  # Keep screen awake during playback
  wakelock_plus: ^1.2.5

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
