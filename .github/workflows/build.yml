name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build_apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Regenerate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.6

      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
