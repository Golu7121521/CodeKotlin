plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.moviestream.movie_stream"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.moviestream.movie_stream"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Signed with the debug keystore by default so a CI build is
            // installable out of the box. Replace with a dedicated
            // release keystore before publishing to a store.
            signingConfig signingConfigs.debug

            // Deliberately OFF: R8 minification on Flutter release
            // builds has a well-known failure mode where it strips
            // classes referenced only via reflection (e.g.
            // SplitCompatApplication from Play Core, or Media3/ExoPlayer
            // internals), producing a "Missing class" crash at runtime
            // that's hard to diagnose. Since this build already restricts
            // itself to a single ABI (arm64-v8a) for size, the extra
            // size reduction from minification isn't worth that risk.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // Explicitly restrict to arm64-v8a only, per the single-ABI
    // requirement. This is intentionally NOT combined with
    // --split-per-abi on the Flutter CLI side (see the CI workflow),
    // since specifying abiFilters here AND passing --split-per-abi to
    // `flutter build apk` causes Gradle/Flutter to disagree about how
    // many APK variants to produce — another known source of build
    // failures. Pick one mechanism; this project uses this one.
    ndk {
        abiFilters "arm64-v8a"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
