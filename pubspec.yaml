name: synesthesia
description: A premium online music streaming app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0

  # Audio playback
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # Image loading & caching
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # Local persistence (favorites, playlists, recently played, settings)
  shared_preferences: ^2.2.2

  # Download support
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  dio: ^5.4.0

  # UI polish
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
