name: all_video_downloader
description: "A modern, advanced all video downloader Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Storage / paths
  path_provider: ^2.1.3

  # Video playback
  video_player: ^2.9.1

  # Permissions
  permission_handler: ^11.3.1

  # File sharing / FileProvider
  share_plus: ^9.0.0

  # Clipboard already covered by flutter services

  # File open
  open_filex: ^4.5.0

  # UUID for IDs
  uuid: ^4.4.2

  # Preferences for settings
  shared_preferences: ^2.2.3

  # Intents / receiving shared URLs
  receive_sharing_intent: ^1.8.0

  # Cached thumbnails / images
  cached_network_image: ^3.3.1

  # Device info for storage stats
  device_info_plus: ^10.1.0

  # App version info
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
